[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vizero-ljp"
version = "0.1.0"
description = "ViZeroLJP: zero-shot Vietnamese Legal Judgment Prediction with input structuring and law retrieval"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "langchain>=1.0,<2",
  # Keep compatibility with the OpenAI client pinned by the existing llm env.
  "langchain-openai>=1.0,<1.1",
  "langchain-ollama>=1.0,<2",
  "langgraph>=1.0,<2",
  "openai==2.6.1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
alqac-agent = "alqac_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
